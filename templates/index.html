<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mini chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="chat-container">
        <h1>Converse Aqui!</h1>
        <div id="chatbox">
            <!-- Chat messages will appear here -->
             <div class="message ai-message">
                <p>Olá! Como posso ajudar?</p>
            </div>
        </div>
        <div id="input-area">
            <textarea id="userInput" placeholder="Digite sua mensagem..." rows="2"></textarea>
            <button id="sendButton">Enviar</button>
            <button id="clearButton" title="Clear Chat History">Limpa</button>
        </div>
         <div id="loading" class="loading-indicator" style="display: none;">
            <p>Gemini está pensando...</p>
        </div>
         <div id="error-message" class="error-indicator" style="display: none;">
            <p>Error communicating with the AI.</p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
